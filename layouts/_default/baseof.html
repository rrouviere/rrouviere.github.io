<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ with site.Home.OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <div class="nav-links"><a href="{{ "posts/" | relURL }}">Posts</a><a href="{{ "about/" | relURL }}">About</a></div>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer><span>© {{ now.Year }} {{ site.Title }}</span>{{ with site.Home.OutputFormats.Get "RSS" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}</footer>
</body>
</html>
