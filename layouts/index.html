{{ define "main" }}
<section class="intro">
  <p class="eyebrow">A place to think out loud</p>
  <h1>{{ site.Title }}</h1>
  <p class="lead">{{ site.Params.description }}</p>
</section>
<section aria-labelledby="recent-posts">
  <div class="section-heading"><h2 id="recent-posts">Recent posts</h2><a href="{{ "posts/" | relURL }}">All posts →</a></div>
  {{ range first 5 (where site.RegularPages "Section" "posts") }}
    {{ partial "post-item.html" . }}
  {{ else }}
    <p>No posts yet. Check back soon.</p>
  {{ end }}
</section>
{{ end }}
