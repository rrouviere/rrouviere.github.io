{{ define "main" }}
<article class="article">
  <header class="page-heading">{{ if eq .Section "posts" }}<time class="eyebrow" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ end }}<h1>{{ .Title }}</h1>{{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}</header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
